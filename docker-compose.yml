version: "3.8"

services:
  content-calendars-api:
    build: .
    container_name: content-calendars-api
    ports:
      - "8103:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  content-calendars-dashboard:
    image: nginx:alpine
    container_name: content-calendars-dashboard
    ports:
      - "8104:80"
    volumes:
      - ./src/dashboard/public:/usr/share/nginx/html
    restart: unless-stopped
